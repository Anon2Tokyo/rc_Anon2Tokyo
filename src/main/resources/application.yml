server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/notifications?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:notify}
    password: ${DB_PASSWORD:notify-local}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  sql:
    init:
      mode: always
notification:
  nameserver: ${ROCKETMQ_NAMESERVER:127.0.0.1:9876}
  mq-max-reconsume-times: 16
  ops-token: ${OPS_TOKEN:}
  poll-interval: 500ms
  http-timeout: 5s
  retry-delays: [10s, 30s, 2m, 10m]
  businesses:
    business-a:
      topic: notify-business-a
      consumer-group: notify-business-a-consumer
      consumer-threads: 1
      delivery-threads: 2
    business-b:
      topic: notify-business-b
      consumer-group: notify-business-b-consumer
      consumer-threads: 1
      delivery-threads: 2
  suppliers:
    supplier-a:
      base-url: ${SUPPLIER_A_URL:http://127.0.0.1:18081}
      token: ${SUPPLIER_A_TOKEN:demo-a}
    supplier-b:
      base-url: ${SUPPLIER_B_URL:http://127.0.0.1:18082}
      token: ${SUPPLIER_B_TOKEN:demo-b}
logging:
  level:
    org.apache.rocketmq: warn
